services:
  fastapi:
    build: .
    container_name: fastapi-ai-chat
    ports:
      - "8001:8000"
    restart: unless-stopped
    # 开发模式：挂载代码目录，修改代码后自动重载
    volumes:
      - .:/app
    # 开启 uvicorn 热重载（仅开发环境使用）
    command: uvicorn fastapi_demo:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
