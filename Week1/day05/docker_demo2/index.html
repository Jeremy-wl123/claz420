<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NL2SQL 教学演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            padding: 2rem 1.5rem;
            color: #1e293b;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 2rem 2rem 2.5rem;
            transition: box-shadow 0.2s;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 1rem;
            background: #f8fafc;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: white;
        }

        .input-group button {
            padding: 0.8rem 2rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: #2563eb;
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        .input-group button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .error-banner.show {
            display: block;
        }

        .result-section {
            margin-top: 1.5rem;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }

        .meta-card {
            background: #f8fafc;
            border-radius: 0.75rem;
            padding: 0.9rem 1.2rem;
            border: 1px solid #e9edf2;
        }

        .meta-card .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #64748b;
            font-weight: 600;
        }

        .meta-card .value {
            font-size: 0.95rem;
            margin-top: 0.25rem;
            word-break: break-all;
            font-family: "JetBrains Mono", "Cascadia Code", monospace;
        }

        .sql-box {
            background: #0f172a;
            color: #e2e8f0;
            padding: 1rem 1.2rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            font-family: "JetBrains Mono", "Cascadia Code", monospace;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 0.75rem;
            border: 1px solid #e9edf2;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 600;
            padding: 0.7rem 1rem;
            text-align: left;
            border-bottom: 1px solid #d1d9e6;
        }

        td {
            padding: 0.65rem 1rem;
            border-bottom: 1px solid #e9edf2;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .row-count {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #475569;
        }

        .row-count span {
            font-weight: 600;
        }

        .loading-spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e9edf2;
            padding-top: 1.5rem;
        }

        .footer a {
            color: #3b82f6;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 NL2SQL 教学</h1>
        <div class="subtitle">用自然语言提问，自动生成 SQL 并返回查询结果</div>

        <!-- 输入区域 -->
        <div class="input-group">
            <input type="text" id="questionInput" placeholder="例如：查询所有年龄大于20的学生姓名和城市" />
            <button id="queryBtn">发送查询</button>
        </div>

        <!-- 错误提示 -->
        <div id="errorBanner" class="error-banner"></div>

        <!-- 结果显示区 -->
        <div id="resultSection" class="result-section">

            <!-- 元信息卡片 -->
            <div class="meta-grid">
                <div class="meta-card">
                    <div class="label">生成 SQL</div>
                    <div class="value" id="sqlDisplay" style="font-size:0.85rem;">—</div>
                </div>
                <div class="meta-card">
                    <div class="label">解释</div>
                    <div class="value" id="explanationDisplay" style="font-size:0.9rem;">—</div>
                </div>
            </div>

            <!-- SQL 高亮框（复制方便） -->
            <div class="sql-box" id="sqlBox">—</div>

            <!-- 表格 -->
            <div class="table-wrapper">
                <table id="resultTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="row-count" id="rowCountDisplay"></div>
        </div>

        <div class="footer">
            ⚡ 后端接口 <code>/query</code> &nbsp;·&nbsp; 基于 DeepSeek &amp; FastAPI
        </div>
    </div>

    <script>
        (function() {
            // DOM 元素
            const questionInput = document.getElementById('questionInput');
            const queryBtn = document.getElementById('queryBtn');
            const errorBanner = document.getElementById('errorBanner');
            const resultSection = document.getElementById('resultSection');
            const sqlDisplay = document.getElementById('sqlDisplay');
            const explanationDisplay = document.getElementById('explanationDisplay');
            const sqlBox = document.getElementById('sqlBox');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const rowCountDisplay = document.getElementById('rowCountDisplay');

            // 状态
            let isLoading = false;

            // 工具：显示错误
            function showError(message) {
                errorBanner.textContent = message;
                errorBanner.classList.add('show');
            }

            function hideError() {
                errorBanner.classList.remove('show');
                errorBanner.textContent = '';
            }

            // 清空表格
            function clearTable() {
                tableHead.innerHTML = '';
                tableBody.innerHTML = '';
            }

            // 渲染表格
            function renderTable(columns, rows) {
                clearTable();

                if (!columns || columns.length === 0) {
                    tableHead.innerHTML = '<tr><td colspan="1" style="text-align:center; color:#94a3b8;">无数据</td></tr>';
                    return;
                }

                // 表头
                const thead = document.createElement('tr');
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col;
                    thead.appendChild(th);
                });
                tableHead.appendChild(thead);

                // 表体
                if (!rows || rows.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = columns.length;
                    td.style.textAlign = 'center';
                    td.style.color = '#94a3b8';
                    td.textContent = '（空结果集）';
                    tr.appendChild(td);
                    tableBody.appendChild(tr);
                    return;
                }

                rows.forEach(row => {
                    const tr = document.createElement('tr');
                    row.forEach(cell => {
                        const td = document.createElement('td');
                        // 处理 null / undefined
                        td.textContent = cell !== null && cell !== undefined ? String(cell) : 'null';
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });
            }

            // 显示结果
            function displayResult(data) {
                hideError();
                resultSection.classList.add('show');

                // 元信息
                sqlDisplay.textContent = data.sql || '—';
                explanationDisplay.textContent = data.explanation || '—';
                sqlBox.textContent = data.sql || '—';

                // 行数信息
                const truncated = data.truncated ? '（已截断，仅显示前100行）' : '';
                rowCountDisplay.innerHTML = `📊 共 <span>${data.row_count}</span> 行 ${truncated}`;

                // 表格
                renderTable(data.columns, data.rows);
            }

            // 主要查询函数
            async function performQuery() {
                const question = questionInput.value.trim();
                if (!question) {
                    showError('请输入您的问题');
                    return;
                }

                if (isLoading) return;
                isLoading = true;
                queryBtn.disabled = true;
                queryBtn.innerHTML = '<span class="loading-spinner"></span> 查询中...';
                hideError();
                resultSection.classList.remove('show');

                try {
                    // 发送请求（假设后端地址为 /query，同源）
                    const response = await fetch('/query', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ question }),
                    });

                    const contentType = response.headers.get('Content-Type') || '';
                    if (!response.ok) {
                        let detail = `请求失败 (${response.status})`;
                        try {
                            const errorData = await response.json();
                            if (errorData.detail) detail = errorData.detail;
                        } catch (_) { /* ignore */ }
                        throw new Error(detail);
                    }

                    const data = await response.json();
                    displayResult(data);

                } catch (err) {
                    showError(err.message || '网络或服务异常，请稍后重试');
                } finally {
                    isLoading = false;
                    queryBtn.disabled = false;
                    queryBtn.textContent = '发送查询';
                }
            }

            // 绑定事件
            queryBtn.addEventListener('click', performQuery);
            questionInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performQuery();
                }
            });

            // 启动时自动聚焦
            questionInput.focus();

            // 可选：健康检查（静默）
            async function checkHealth() {
                try {
                    const resp = await fetch('/health');
                    if (resp.ok) {
                        console.log('✅ 后端服务健康');
                    } else {
                        console.warn('⚠️ 健康检查失败');
                    }
                } catch (_) {
                    console.warn('⚠️ 无法连接后端服务，请确认服务已启动');
                }
            }
            checkHealth();
        })();
    </script>
</body>
</html>
