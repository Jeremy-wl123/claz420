
services:
  # ==================== MySQL 数据库服务 ====================
  mysql:
    image: mysql:8.0
    container_name: nl2sql-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"          # 映射到宿主机 3307，避免与本地 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # ==================== FastAPI 应用服务 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nl2sql-app2
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库连接（指向 mysql 服务名，Docker DNS 自动解析）
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-teaching}
      # DeepSeek API Key（从 .env 或环境变量传入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

# ==================== 持久化存储 ====================
volumes:
  mysql_data:
    driver: local

# ==================== 网络 ====================
networks:
  app-network:
    driver: bridge
