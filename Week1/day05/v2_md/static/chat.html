<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat - 流式聊天机器人</title>

<!-- ==================== 第三方库 ==================== -->
<!-- marked v4.3.0：支持 setOptions({ highlight }) 旧式 API -->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<!-- highlight.js v11.9.0：代码语法高亮 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<!-- DOMPurify v3.0.6：HTML 净化，防止 XSS -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

<style>
  :root {
    --bg: #f0f2f5;
    --sidebar: #1e293b;
    --card: #ffffff;
    --text: #1a1a2e;
    --sub: #94a3b8;
    --border: #e2e8f0;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --user-bubble: #6366f1;
    --ai-bubble: #f1f5f9;
    --user-text: #fff;
    --ai-text: #1e293b;
    --shadow: 0 4px 12px rgba(0,0,0,.08);
    --radius: 16px;
    --radius-sm: 8px;
    --header-h: 56px;
    --footer-h: 72px;
    --sidebar-w: 260px;
    --code-bg: #fafafa;
    --code-border: #d0d7de;
    --inline-code-bg: rgba(99,102,241,.1);
    --inline-code-text: #6366f1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar);
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-header .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .sidebar-header .logo span { color: var(--accent); }
  .sidebar-header .subtitle { font-size: 12px; color: #64748b; margin-top: 4px; }
  .sidebar-body { flex: 1; padding: 16px; overflow-y: auto; }
  .sidebar-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 10px; }
  .sidebar-body .hint-tag {
    display: block; width: 100%; text-align: left;
    padding: 10px 14px; margin-bottom: 6px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius-sm); color: #cbd5e1; font-size: 13px;
    cursor: pointer; transition: all .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-body .hint-tag:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.15); color: #fff; }

  .sidebar-footer {
    padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ---- Main ---- */
  .main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0;
  }
  .chat-header {
    height: var(--header-h);
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px;
    font-weight: 600; font-size: 15px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .chat-header .model-badge {
    margin-left: 10px; padding: 3px 10px; border-radius: 12px;
    background: #eef2ff; color: var(--accent); font-size: 11px; font-weight: 500;
  }

  /* ---- Messages ---- */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  .msg-row { display: flex; gap: 10px; max-width: 85%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.ai { align-self: flex-start; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .msg-row.user .msg-avatar { background: var(--accent); color: #fff; }
  .msg-row.ai .msg-avatar { background: #e2e8f0; }

  .msg-bubble {
    padding: 12px 18px; border-radius: 18px;
    font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user .msg-bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg-row.ai .msg-bubble { background: var(--ai-bubble); color: var(--ai-text); border-bottom-left-radius: 4px; }
  .msg-row.ai .msg-bubble.streaming { border-bottom-left-radius: 4px; }

  /* ---- Markdown 渲染样式 ---- */
  .msg-bubble.rendered {
    white-space: normal;
  }
  .msg-bubble.rendered > *:first-child { margin-top: 0; }
  .msg-bubble.rendered > *:last-child { margin-bottom: 0; }
  .msg-bubble.rendered p { margin: 6px 0; }
  .msg-bubble.rendered h1,
  .msg-bubble.rendered h2,
  .msg-bubble.rendered h3,
  .msg-bubble.rendered h4,
  .msg-bubble.rendered h5,
  .msg-bubble.rendered h6 {
    margin: 12px 0 6px; font-weight: 600; line-height: 1.4;
  }
  .msg-bubble.rendered h1 { font-size: 1.4em; }
  .msg-bubble.rendered h2 { font-size: 1.3em; }
  .msg-bubble.rendered h3 { font-size: 1.2em; }
  .msg-bubble.rendered h4 { font-size: 1.1em; }
  .msg-bubble.rendered ul,
  .msg-bubble.rendered ol {
    padding-left: 20px; margin: 6px 0;
  }
  .msg-bubble.rendered li { margin: 3px 0; }
  .msg-bubble.rendered a {
    color: var(--accent); text-decoration: none;
  }
  .msg-bubble.rendered a:hover { text-decoration: underline; }
  .msg-bubble.rendered blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px; margin: 8px 0;
    color: var(--sub);
  }
  .msg-bubble.rendered hr {
    border: none; border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  /* 行内代码 */
  .msg-bubble.rendered code:not(pre code) {
    background: var(--inline-code-bg);
    color: var(--inline-code-text);
    padding: 2px 6px; border-radius: 4px;
    font-size: 13px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  /* 代码块 */
  .msg-bubble.rendered pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 8px 0;
    overflow-x: auto;
    position: relative;
    white-space: pre;
  }
  .msg-bubble.rendered pre code.hljs {
    background: transparent;
    padding: 0;
    font-size: 13px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  /* 表格 */
  .msg-bubble.rendered table {
    border-collapse: collapse; width: 100%; margin: 8px 0;
    font-size: 13px;
  }
  .msg-bubble.rendered th,
  .msg-bubble.rendered td {
    border: 1px solid var(--border); padding: 6px 12px; text-align: left;
  }
  .msg-bubble.rendered th {
    background: #e2e8f0; font-weight: 600;
  }
  .msg-bubble.rendered img {
    max-width: 100%; border-radius: var(--radius-sm);
  }

  /* 代码块复制按钮 */
  .copy-code-btn {
    position: absolute; top: 6px; right: 6px;
    padding: 2px 10px; font-size: 11px;
    color: #57606a; background: rgba(0,0,0,.06);
    border: 1px solid #d0d7de;
    border-radius: 4px; cursor: pointer;
    transition: all .15s; z-index: 10;
  }
  .copy-code-btn:hover {
    color: #fff; background: var(--accent);
    border-color: var(--accent);
  }

  /* Markdown 渲染淡入动画，减少"跳动"突兀感 */
  .msg-bubble.rendered {
    animation: renderFadeIn .25s ease-out;
  }
  @keyframes renderFadeIn {
    from { opacity: .6; }
    to { opacity: 1; }
  }

  /* 错误重试按钮 */
  .retry-btn {
    margin-top: 8px; padding: 4px 16px;
    border: 1px solid var(--accent); border-radius: 6px;
    background: transparent; color: var(--accent);
    font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .retry-btn:hover {
    background: var(--accent); color: #fff;
  }

  /* cursor blink */
  .cursor-blink {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--accent);
    margin-left: 2px; vertical-align: text-bottom;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* typing dots */
  .typing-dots { display: flex; gap: 4px; padding: 6px 0; }
  .typing-dots span {
    width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;
    animation: bounce 1.4s ease-in-out infinite both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -.16s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* ---- Input ---- */
  .chat-footer {
    padding: 12px 24px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .input-wrap {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg); border-radius: 24px;
    padding: 6px 6px 6px 20px;
    border: 2px solid transparent;
    transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); background: var(--card); }
  .input-wrap textarea {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; font-family: inherit; line-height: 1.5;
    resize: none; max-height: 120px; padding: 7px 0; color: var(--text);
  }
  .input-wrap textarea::placeholder { color: var(--sub); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:active { transform: scale(.92); }
  .send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }

  /* ---- Welcome ---- */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--sub); text-align: center; padding: 40px;
  }
  .welcome .icon { font-size: 56px; margin-bottom: 16px; }
  .welcome h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; max-width: 400px; line-height: 1.6; }

  /* ---- Error Toast ---- */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 20px; font-size: 13px;
    background: #fef2f2; color: #991b1b;
    border: 1px solid #fecaca;
    z-index: 999; animation: fadeInUp .3s;
  }
  @keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* ---- Clear Button ---- */
  .clear-btn {
    margin-left: auto; padding: 4px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
    font-size: 12px; color: var(--sub); transition: all .15s;
  }
  .clear-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .msg-row { max-width: 95%; }
    .chat-footer { padding: 10px 12px; }
    .messages { padding: 12px; }
  }
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">🤖 Olla<span>ma</span></div>
    <div class="subtitle">本地大模型聊天服务</div>
  </div>
  <div class="sidebar-body">
    <h3>💡 试试这些</h3>
    <button class="hint-tag" onclick="sendHint(this)">用Python写一个快速排序</button>
    <button class="hint-tag" onclick="sendHint(this)">给我讲一个简短的笑话</button>
    <button class="hint-tag" onclick="sendHint(this)">今天心情不错，推荐一首诗</button>
    <button class="hint-tag" onclick="sendHint(this)">解释一下什么是机器学习</button>
    <button class="hint-tag" onclick="sendHint(this)">推荐3本适合初学者的书</button>
    <button class="hint-tag" onclick="sendHint(this)">今天天气真好，写一句话</button>
  </div>
  <div class="sidebar-footer">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">连接中...</span>
  </div>
</aside>

<!-- 主聊天区 -->
<div class="main">
  <header class="chat-header">
    流式对话
    <span class="model-badge" id="modelName">...</span>
    <button class="clear-btn" onclick="clearChat()">清空对话</button>
  </header>

  <div class="messages" id="messages">
    <div class="welcome">
      <div class="icon">💬</div>
      <h2>与本地 Ollama 模型对话</h2>
      <p>支持流式输出与 Markdown 渲染，AI 的回答会逐字打印，完成后自动格式化。在左侧选择一个问题，或直接输入你想聊的内容。</p>
    </div>
  </div>

  <div class="chat-footer">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行..."
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ==================== Markdown 配置 ====================
// marked v4.3.0：使用 setOptions({ highlight }) 旧式 API
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
    }
    try { return hljs.highlightAuto(code).value; } catch (e) {}
    return code;
  },
  breaks: true,
  gfm: true
});

/**
 * 将 Markdown 文本渲染为安全的 HTML 并插入到气泡中
 * @param {HTMLElement} bubble - 消息气泡元素
 * @param {string} markdownText - 原始 Markdown 文本
 */
function renderMarkdown(bubble, markdownText) {
  // 1. marked 解析为 HTML（此时可能包含恶意脚本）
  const dirtyHtml = marked.parse(markdownText);
  // 2. DOMPurify 净化，ADD_ATTR 保留 class 以支持 highlight.js 高亮
  const cleanHtml = DOMPurify.sanitize(dirtyHtml, {
    ADD_ATTR: ['class'],
    ADD_TAGS: ['pre', 'code']
  });
  // 3. 插入净化后的 HTML
  bubble.innerHTML = cleanHtml;
  bubble.classList.add('rendered');
  // 4. 为每个代码块添加复制按钮
  bubble.querySelectorAll('pre').forEach(function(pre) {
    addCopyButton(pre);
  });
}

/**
 * 为 <pre> 代码块添加复制按钮
 */
function addCopyButton(pre) {
  const btn = document.createElement('button');
  btn.className = 'copy-code-btn';
  btn.textContent = '复制';
  btn.addEventListener('click', () => {
    const code = pre.querySelector('code');
    const text = code ? code.textContent : pre.textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制'; }, 2000);
    }).catch(() => {
      btn.textContent = '复制失败';
      setTimeout(() => { btn.textContent = '复制'; }, 2000);
    });
  });
  pre.appendChild(btn);
}

// ==================== 状态 ====================
let isStreaming = false;
let abortController = null;
let modelName = '...';
let toastTimer = null;       // Toast 自动移除计时器（用于清理防泄漏）
let lastUserMessage = '';    // 最后一条用户消息（用于重试）

// ==================== 初始化 ====================
(async function init() {
  // 健康检查 & 获取模型名（合并为一次轻量请求，不再调用 /chat）
  try {
    const res = await fetch('/health');
    const data = await res.json();
    setStatus(data.status === 'ok');
    if (data.model) {
      modelName = data.model;
      document.getElementById('modelName').textContent = modelName;
    }
  } catch (e) {
    setStatus(false);
  }
})();

function setStatus(ok) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (ok) {
    dot.style.background = '#10b981';
    txt.textContent = '服务正常';
  } else {
    dot.style.background = '#ef4444';
    txt.textContent = '服务离线';
  }
}

// ==================== 发送消息 ====================
async function sendMessage(msg) {
  if (isStreaming) return;

  const input = document.getElementById('userInput');
  const text = (msg || input.value).trim();
  if (!text) return;

  // 清空输入
  input.value = '';
  autoResize(input);

  // 移除欢迎页
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  // 添加用户消息
  addMessage('user', text);

  // 记录最后一条用户消息（用于重试）
  lastUserMessage = text;

  // 添加AI占位消息
  const aiBubble = addMessage('ai', '', true);

  // 显示"思考中"动画（typing dots），直到收到第一个 token
  aiBubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  // 开始流式
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  let fullText = '';
  let hasError = false;
  let firstTokenReceived = false;

  try {
    abortController = new AbortController();
    const response = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: abortController.signal
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // 解析 SSE 事件（以 \n\n 分隔完整事件，避免跨 chunk 数据丢失）
      const events = buffer.split('\n\n');
      buffer = events.pop() || ''; // 保留不完整的事件

      for (const evt of events) {
        const line = evt.trim();
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);

        try {
          const data = JSON.parse(payload);
          if (data.content) {
            // 首次收到 token 时清除"思考中"动画
            if (!firstTokenReceived) {
              firstTokenReceived = true;
              aiBubble.innerHTML = '';
            }
            // 流式阶段：使用 textContent 显示纯文本
            fullText += data.content;
            aiBubble.textContent = fullText;
            aiBubble.classList.add('streaming');
            scrollToBottom();
          } else if (data.done) {
            aiBubble.classList.remove('streaming');
          } else if (data.error) {
            hasError = true;
            aiBubble.innerHTML = '';
            aiBubble.textContent = `❌ 错误: ${data.error}`;
            aiBubble.style.color = '#dc2626';
            showToast('模型调用失败');
          }
        } catch (e) { /* 忽略解析错误 */ }
      }
    }

    // 处理剩余 buffer 中的完整事件
    const remaining = buffer.trim();
    if (remaining.startsWith('data: ')) {
      try {
        const data = JSON.parse(remaining.slice(6));
        if (data.content) {
          if (!firstTokenReceived) {
            firstTokenReceived = true;
            aiBubble.innerHTML = '';
          }
          fullText += data.content;
          aiBubble.textContent = fullText;
        }
      } catch (e) { /* ignore */ }
    }

    aiBubble.classList.remove('streaming');

    // 流式完成后：一次性渲染 Markdown
    if (hasError) {
      // 错误消息已通过 textContent 设置，不渲染 Markdown
    } else if (!fullText) {
      aiBubble.innerHTML = '';
      aiBubble.textContent = '（模型未返回内容）';
      aiBubble.style.color = '#94a3b8';
    } else {
      // 渲染 Markdown（含代码高亮 + XSS 净化）
      renderMarkdown(aiBubble, fullText);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户主动取消，渲染已接收的部分内容
      console.log('请求已被用户取消');
      aiBubble.classList.remove('streaming');
      if (fullText && !hasError) {
        renderMarkdown(aiBubble, fullText);
      } else if (!fullText) {
        aiBubble.innerHTML = '';
        aiBubble.textContent = '（已取消）';
        aiBubble.style.color = '#94a3b8';
      }
    } else {
      console.error('Stream error:', err);
      aiBubble.classList.remove('streaming');
      aiBubble.innerHTML = '';
      aiBubble.textContent = '⚠️ 连接失败，请检查 Ollama 服务是否运行';
      aiBubble.style.color = '#dc2626';
      // 添加重试按钮
      const retryBtn = document.createElement('button');
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = '🔄 重试';
      retryBtn.onclick = () => sendMessage(lastUserMessage);
      aiBubble.appendChild(document.createElement('br'));
      aiBubble.appendChild(retryBtn);
      setStatus(false);
      showToast('服务连接失败');
    }
  } finally {
    isStreaming = false;
    abortController = null;
    document.getElementById('sendBtn').disabled = false;
    scrollToBottom();
  }
}

function sendHint(btn) {
  sendMessage(btn.textContent);
}

// ==================== UI 辅助 ====================
function addMessage(role, text, isStreaming) {
  const container = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (isStreaming) bubble.classList.add('streaming');
  if (text) bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);
  container.appendChild(row);

  scrollToBottom();
  return bubble;
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  // 使用 requestAnimationFrame 确保 DOM 已更新
  requestAnimationFrame(() => {
    el.scrollTop = el.scrollHeight;
  });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  // Enter 或 Ctrl+Enter 发送，Shift+Enter 换行
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function clearChat() {
  // 如果正在流式输出，先取消请求再清空
  if (isStreaming && abortController) {
    abortController.abort();
  }
  document.getElementById('messages').innerHTML = `
    <div class="welcome">
      <div class="icon">💬</div>
      <h2>与本地 Ollama 模型对话</h2>
      <p>支持流式输出与 Markdown 渲染，AI 的回答会逐字打印，完成后自动格式化。在左侧选择一个问题，或直接输入你想聊的内容。</p>
    </div>`;
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  // 清除上一个 toast 的计时器，避免内存泄漏
  if (toastTimer) clearTimeout(toastTimer);
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  toastTimer = setTimeout(() => {
    toast.remove();
    toastTimer = null;
  }, 3000);
}

// 页面关闭时取消进行中的请求和清理计时器
window.addEventListener('beforeunload', () => {
  if (isStreaming && abortController) {
    abortController.abort();
  }
  if (toastTimer) clearTimeout(toastTimer);
});
</script>
</body>
