<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NL2SQL - 自然语言查询</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1a1a2e;
    --sub: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --code-bg: #1e293b;
    --code-text: #e2e8f0;
    --tag-bg: #eef2ff;
    --tag-text: #4f46e5;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ---- Header ---- */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .logo span { color: var(--accent); }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px;
    background: var(--success); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---- Main ---- */
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

  /* ---- Search Card ---- */
  .search-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 28px 32px;
    margin-bottom: 24px;
  }
  .search-card h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .input-row { display: flex; gap: 12px; }
  .input-row input {
    flex: 1; padding: 12px 16px; font-size: 15px;
    border: 2px solid var(--border); border-radius: var(--radius-sm);
    outline: none; transition: border-color .2s;
    background: var(--bg);
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    padding: 12px 28px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: background .2s, transform .1s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .input-row button:hover { background: var(--accent-hover); }
  .input-row button:active { transform: scale(.97); }
  .input-row button:disabled { opacity: .6; cursor: not-allowed; }

  /* ---- Example Tags ---- */
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .example-tag {
    padding: 6px 14px; font-size: 13px; border-radius: 20px; cursor: pointer;
    background: var(--tag-bg); color: var(--tag-text);
    border: 1px solid transparent; transition: all .2s;
  }
  .example-tag:hover { border-color: var(--accent); background: #fff; }

  /* ---- Result Cards ---- */
  .result-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
  }
  .result-card .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 14px;
  }
  .result-card .card-body { padding: 16px 20px; }

  /* ---- SQL Block ---- */
  .sql-block {
    background: var(--code-bg); color: var(--code-text);
    padding: 16px 20px; border-radius: var(--radius-sm);
    font-family: "Fira Code", "JetBrains Mono", "Consolas", monospace;
    font-size: 14px; line-height: 1.8; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all;
  }

  /* ---- Explanation ---- */
  .explanation {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 12px 16px; background: #fffbeb; border-radius: var(--radius-sm);
    border-left: 4px solid var(--warning); font-size: 14px;
  }

  /* ---- Table ---- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f8fafc; font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  tr:hover td { background: #f8fafc; }

  .row-count { font-size: 13px; color: var(--sub); margin-top: 8px; }
  .truncated-badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    background: #fff7ed; color: #ea580c; font-size: 12px; margin-left: 8px;
  }

  /* ---- States ---- */
  .loading { text-align: center; padding: 40px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-card {
    padding: 16px 20px; background: #fef2f2; border-radius: var(--radius-sm);
    border-left: 4px solid var(--danger); color: #991b1b;
  }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--sub); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

  /* ---- Footer ---- */
  footer { text-align: center; padding: 24px; font-size: 12px; color: var(--sub); }

  /* ---- Toast ---- */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px;
    color: #fff; z-index: 999; transition: opacity .3s;
  }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }
</style>
</head>
<body>

<header>
  <div class="logo">🔍 NL<span>2</span>SQL</div>
  <div><span class="status-dot"></span>服务运行中</div>
</header>

<main>
  <!-- 查询输入区 -->
  <div class="search-card">
    <h2>💬 用自然语言查询数据库</h2>
    <div class="input-row">
      <input id="questionInput" type="text"
             placeholder="例如：查询北京的学生有哪些？他们选了哪些课？"
             autocomplete="off"
             onkeydown="if(event.key==='Enter')doQuery()">
      <button id="queryBtn" onclick="doQuery()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        查询
      </button>
    </div>
    <div class="examples">
      <span>试试：</span>
      <span class="example-tag" onclick="setExample(this)">北京的学生有哪些</span>
      <span class="example-tag" onclick="setExample(this)">每门课的平均分</span>
      <span class="example-tag" onclick="setExample(this)">谁选了Python基础</span>
      <span class="example-tag" onclick="setExample(this)">总成绩最高的学生</span>
      <span class="example-tag" onclick="setExample(this)">各城市学生人数</span>
    </div>
  </div>

  <!-- 结果区 -->
  <div id="results"></div>
</main>

<footer>NL2SQL 教学演示 · Powered by DeepSeek</footer>

<script>
const API = '/query';

function setExample(el) {
  document.getElementById('questionInput').value = el.textContent;
  doQuery();
}

async function doQuery() {
  const input = document.getElementById('questionInput');
  const btn = document.getElementById('queryBtn');
  const results = document.getElementById('results');
  const question = input.value.trim();

  if (!question) return;

  // Loading
  btn.disabled = true;
  btn.textContent = '查询中...';
  results.innerHTML = '<div class="loading"><div class="spinner"></div><p>AI 正在生成 SQL...</p></div>';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const data = await res.json();

    if (!res.ok) {
      results.innerHTML = `<div class="error-card"><strong>请求失败</strong><p style="margin-top:6px">${escapeHtml(data.detail || '未知错误')}</p></div>`;
      return;
    }

    renderResult(data);
  } catch (err) {
    results.innerHTML = `<div class="error-card"><strong>网络错误</strong><p style="margin-top:6px">${escapeHtml(err.message)}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

function renderResult(data) {
  const { sql, explanation, columns, rows, truncated, row_count } = data;
  let html = '';

  // SQL 展示
  html += `<div class="result-card">
    <div class="card-header">📝 生成的 SQL</div>
    <div class="card-body"><div class="sql-block">${escapeHtml(sql)}</div></div>
  </div>`;

  // 解释
  html += `<div class="result-card">
    <div class="card-header">💡 查询说明</div>
    <div class="card-body"><div class="explanation">${escapeHtml(explanation)}</div></div>
  </div>`;

  // 结果表格
  html += `<div class="result-card">
    <div class="card-header">📊 查询结果</div>
    <div class="card-body">`;

  if (rows.length === 0) {
    html += '<p style="color:var(--sub);padding:20px;text-align:center">查询无结果</p>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr>';
    columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      html += '<tr>';
      row.forEach(cell => html += `<td>${escapeHtml(String(cell ?? ''))}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  html += `<div class="row-count">共 ${row_count} 行`;
  if (truncated) html += '<span class="truncated-badge">结果已截断</span>';
  html += '</div></div></div>';

  document.getElementById('results').innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 页面加载时检查服务状态
(async function() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error('unhealthy');
  } catch (e) {
    document.querySelector('.status-dot').style.background = 'var(--danger)';
  }
})();
</script>

</body>
</html>
